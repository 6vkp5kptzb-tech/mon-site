<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Illustration : un écran de cinéma en plein air au bord de la mer, la nuit, qui projette un western au soleil couchant, devant des spectateurs assis">
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="1" stop-color="#121a2a"/>
    </linearGradient>
    <linearGradient id="western" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="0.55" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <radialGradient id="faisceau" cx="0.5" cy="1" r="1">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      .big { font: 800 92px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e6edf3; letter-spacing: -1px; }
      .eyebrow { font: 600 28px ui-monospace, "Cascadia Code", Consolas, monospace; fill: #22d3ee; letter-spacing: 3px; }
      .sub { font: 24px ui-monospace, "Cascadia Code", Consolas, monospace; fill: #9aa7b5; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#nuit)"/>
  <g fill="#e6edf3">
    <circle cx="160" cy="340" r="2"/><circle cx="380" cy="400" r="1.5"/><circle cx="1480" cy="110" r="1.5"/>
    <circle cx="1050" cy="70" r="2"/><circle cx="1240" cy="60" r="1.5"/><circle cx="1530" cy="300" r="2"/>
    <circle cx="90" cy="480" r="1.5"/><circle cx="1420" cy="420" r="1.5"/>
  </g>
  <text x="120" y="150" class="eyebrow">CINÉMA DE PLEIN AIR · LOCQUEMEAU</text>
  <text x="120" y="250" class="big" style="font-size:72px">Il était une fois dans l'Ouest</text>
  <!-- La mer, au loin -->
  <rect x="0" y="720" width="1600" height="80" fill="#0f2a33"/>
  <g stroke="#67e8f9" stroke-width="2" opacity="0.35">
    <line x1="80" y1="745" x2="220" y2="745"/><line x1="1340" y1="760" x2="1520" y2="760"/>
    <line x1="260" y1="775" x2="360" y2="775"/><line x1="1220" y1="740" x2="1300" y2="740"/>
  </g>
  <!-- L'écran et le western projeté -->
  <rect x="440" y="340" width="720" height="380" fill="#fdba74" opacity="0.25" filter="url(#glow)"/>
  <rect x="460" y="360" width="680" height="340" fill="url(#western)"/>
  <circle cx="800" cy="560" r="70" fill="#fef3c7" opacity="0.9"/>
  <path d="M460,600 L540,560 L600,580 L640,520 L690,520 L700,600 L900,600 L910,530 L960,530 L990,575 L1060,550 L1140,590 L1140,700 L460,700 Z" fill="#431407"/>
  <!-- Rails vers l'horizon -->
  <path d="M760,700 L795,610 M840,700 L805,610" stroke="#1c0a03" stroke-width="5"/>
  <!-- Un cavalier à l'horizon -->
  <g fill="#1c0a03" transform="translate(1010 600)">
    <path d="M-30,0 C-28,-14 -10,-20 10,-18 L22,-28 L26,-24 L18,-12 C20,-4 16,2 10,2 L10,14 L6,14 L4,2 L-16,2 L-18,14 L-22,14 L-22,2 Z"/>
    <rect x="-6" y="-42" width="10" height="24"/>
    <rect x="-12" y="-48" width="22" height="6"/>
  </g>
  <!-- Pieds de l'écran -->
  <path d="M520,700 L500,830 M1080,700 L1100,830" stroke="#334155" stroke-width="10"/>
  <!-- Le sol et le faisceau du projecteur -->
  <rect x="0" y="800" width="1600" height="200" fill="#070a0f"/>
  <path d="M800,1000 L460,360 L1140,360 Z" fill="url(#faisceau)"/>
  <!-- Les spectateurs -->
  <g fill="#000">
    <circle cx="380" cy="880" r="28"/><path d="M330,1000 C330,930 345,905 380,905 C415,905 430,930 430,1000 Z"/>
    <circle cx="560" cy="865" r="32"/><path d="M505,1000 C505,920 522,893 560,893 C598,893 615,920 615,1000 Z"/>
    <circle cx="740" cy="885" r="26"/><path d="M693,1000 C693,935 707,910 740,910 C773,910 787,935 787,1000 Z"/>
    <circle cx="920" cy="870" r="30"/><path d="M868,1000 C868,925 884,898 920,898 C956,898 972,925 972,1000 Z"/>
    <circle cx="1100" cy="882" r="27"/><path d="M1052,1000 C1052,932 1066,907 1100,907 C1134,907 1148,932 1148,1000 Z"/>
    <circle cx="1270" cy="868" r="31"/><path d="M1216,1000 C1216,923 1232,896 1270,896 C1308,896 1324,923 1324,1000 Z"/>
  </g>
  <text x="1480" y="960" text-anchor="end" class="sub">Sergio Leone · musique d'Ennio Morricone</text>
</svg>
