<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Les quatre règles de Descartes appliquées à la création d'un site web : vérifier, découper, avancer par étapes, tout contrôler">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#132131"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2736"/>
      <stop offset="1" stop-color="#121b26"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee" fill-opacity="0.7"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Titre -->
  <text x="800" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#e6edf3">Discours de la méthode… web</text>
  <text x="800" y="160" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26" fill="#9aa7b5">Quatre règles pour transformer un projet intimidant en actions maîtrisables</text>

  <!-- Fenêtre de navigateur centrale -->
  <g transform="translate(560 220)">
    <rect width="480" height="300" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M0 16a16 16 0 0 1 16-16h448a16 16 0 0 1 16 16v28H0z" fill="#22d3ee" fill-opacity="0.12"/>
    <circle cx="26" cy="22" r="7" fill="#f87171"/>
    <circle cx="50" cy="22" r="7" fill="#fbbf24"/>
    <circle cx="74" cy="22" r="7" fill="#34d399"/>
    <rect x="104" y="12" width="340" height="20" rx="10" fill="#0b0f14" fill-opacity="0.6"/>
    <text x="120" y="28" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#9aa7b5">https://mon-site.fr</text>
    <!-- maquette de page -->
    <rect x="30" y="70" width="420" height="60" rx="8" fill="#22d3ee" fill-opacity="0.18"/>
    <rect x="30" y="148" width="200" height="12" rx="6" fill="#e6edf3" fill-opacity="0.35"/>
    <rect x="30" y="172" width="260" height="12" rx="6" fill="#e6edf3" fill-opacity="0.2"/>
    <rect x="30" y="196" width="230" height="12" rx="6" fill="#e6edf3" fill-opacity="0.2"/>
    <rect x="310" y="148" width="140" height="120" rx="8" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.3"/>
    <rect x="30" y="236" width="120" height="32" rx="16" fill="#22d3ee" fill-opacity="0.6"/>
  </g>

  <!-- Flèches vers les 4 cartes -->
  <g stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 8" fill="none" marker-end="url(#arrow)">
    <path d="M640 520C560 600 300 600 230 630"/>
    <path d="M740 520C720 580 640 600 610 630"/>
    <path d="M860 520C880 580 960 600 990 630"/>
    <path d="M960 520C1040 600 1300 600 1370 630"/>
  </g>

  <!-- Cartes des 4 règles -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <!-- 1. Évidence -->
    <g transform="translate(60 650)">
      <rect width="340" height="280" rx="18" fill="url(#card)" stroke="#243041" stroke-width="2"/>
      <circle cx="40" cy="40" r="22" fill="#22d3ee"/>
      <text x="40" y="49" text-anchor="middle" font-size="24" font-weight="700" fill="#0b0f14">1</text>
      <text x="76" y="50" font-size="30" font-weight="700" fill="#e6edf3">L'évidence</text>
      <!-- loupe -->
      <circle cx="160" cy="150" r="46" fill="none" stroke="#67e8f9" stroke-width="8"/>
      <path d="M193 183L232 222" stroke="#67e8f9" stroke-width="12" stroke-linecap="round"/>
      <text x="160" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#67e8f9">?</text>
      <text x="170" y="262" text-anchor="middle" font-size="24" fill="#9aa7b5">Vérifier</text>
    </g>

    <!-- 2. Analyse -->
    <g transform="translate(440 650)">
      <rect width="340" height="280" rx="18" fill="url(#card)" stroke="#243041" stroke-width="2"/>
      <circle cx="40" cy="40" r="22" fill="#22d3ee"/>
      <text x="40" y="49" text-anchor="middle" font-size="24" font-weight="700" fill="#0b0f14">2</text>
      <text x="76" y="50" font-size="30" font-weight="700" fill="#e6edf3">L'analyse</text>
      <!-- bloc découpé -->
      <g fill="#22d3ee" fill-opacity="0.25" stroke="#67e8f9" stroke-width="2">
        <rect x="80" y="100" width="80" height="44" rx="6"/>
        <rect x="176" y="96" width="80" height="44" rx="6"/>
        <rect x="76" y="160" width="56" height="44" rx="6"/>
        <rect x="146" y="164" width="56" height="44" rx="6"/>
        <rect x="216" y="158" width="44" height="44" rx="6"/>
      </g>
      <text x="170" y="262" text-anchor="middle" font-size="24" fill="#9aa7b5">Découper</text>
    </g>

    <!-- 3. Ordre -->
    <g transform="translate(820 650)">
      <rect width="340" height="280" rx="18" fill="url(#card)" stroke="#243041" stroke-width="2"/>
      <circle cx="40" cy="40" r="22" fill="#22d3ee"/>
      <text x="40" y="49" text-anchor="middle" font-size="24" font-weight="700" fill="#0b0f14">3</text>
      <text x="76" y="50" font-size="30" font-weight="700" fill="#e6edf3">L'ordre</text>
      <!-- escalier -->
      <path d="M70 216H130V176H190V136H250V96H280" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="#22d3ee" fill-opacity="0.2">
        <rect x="70" y="176" width="60" height="40"/>
        <rect x="130" y="136" width="60" height="80"/>
        <rect x="190" y="96" width="60" height="120"/>
      </g>
      <text x="170" y="262" text-anchor="middle" font-size="24" fill="#9aa7b5">Avancer par étapes</text>
    </g>

    <!-- 4. Dénombrement -->
    <g transform="translate(1200 650)">
      <rect width="340" height="280" rx="18" fill="url(#card)" stroke="#243041" stroke-width="2"/>
      <circle cx="40" cy="40" r="22" fill="#22d3ee"/>
      <text x="40" y="49" text-anchor="middle" font-size="24" font-weight="700" fill="#0b0f14">4</text>
      <text x="76" y="50" font-size="26" font-weight="700" fill="#e6edf3">Le dénombrement</text>
      <!-- checklist -->
      <g stroke="#67e8f9" stroke-width="3" fill="none">
        <rect x="80" y="94" width="28" height="28" rx="5"/>
        <rect x="80" y="138" width="28" height="28" rx="5"/>
        <rect x="80" y="182" width="28" height="28" rx="5"/>
      </g>
      <g stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M86 108l7 7l14-16"/>
        <path d="M86 152l7 7l14-16"/>
        <path d="M86 196l7 7l14-16"/>
      </g>
      <g fill="#e6edf3" fill-opacity="0.3">
        <rect x="124" y="102" width="130" height="12" rx="6"/>
        <rect x="124" y="146" width="110" height="12" rx="6"/>
        <rect x="124" y="190" width="140" height="12" rx="6"/>
      </g>
      <text x="170" y="262" text-anchor="middle" font-size="24" fill="#9aa7b5">Tout contrôler</text>
    </g>
  </g>
</svg>
