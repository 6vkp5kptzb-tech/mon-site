<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Illustration : un ballon dérive dans la nuit au-dessus d'une île volcanique perdue dans l'océan">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#0f2a33"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="isle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e63"/>
      <stop offset="1" stop-color="#0b1f26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .big { font: 800 92px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e6edf3; letter-spacing: -1px; }
      .eyebrow { font: 600 28px ui-monospace, "Cascadia Code", Consolas, monospace; fill: #22d3ee; letter-spacing: 3px; }
      .sub { font: 24px ui-monospace, "Cascadia Code", Consolas, monospace; fill: #9aa7b5; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#e6edf3">
    <circle cx="180" cy="340" r="2"/><circle cx="420" cy="400" r="1.5"/><circle cx="640" cy="320" r="2"/>
    <circle cx="880" cy="90" r="1.5"/><circle cx="1010" cy="200" r="2"/><circle cx="1500" cy="330" r="1.5"/>
    <circle cx="760" cy="430" r="1.5"/><circle cx="300" cy="460" r="1.5"/><circle cx="1460" cy="80" r="2"/>
  </g>
  <circle cx="1330" cy="190" r="70" fill="#22d3ee" opacity="0.14"/>
  <circle cx="1330" cy="190" r="44" fill="#67e8f9" opacity="0.5"/>
  <text x="120" y="150" class="eyebrow">SÉRIE TV · ORTF 1973 · SOUVENIR D'ENFANCE</text>
  <text x="120" y="250" class="big">L'Île mystérieuse</text>
  <!-- Ballon -->
  <g transform="translate(1110 330) rotate(8)">
    <ellipse cx="0" cy="0" rx="92" ry="110" fill="#22d3ee" opacity="0.25" filter="url(#glow)"/>
    <path d="M0,-110 C62,-110 92,-60 92,-5 C92,45 45,80 18,110 L-18,110 C-45,80 -92,45 -92,-5 C-92,-60 -62,-110 0,-110 Z" fill="#0f2a33" stroke="#67e8f9" stroke-width="5"/>
    <path d="M0,-110 C-30,-60 -32,50 -18,110 M0,-110 C30,-60 32,50 18,110 M-92,-5 C-40,10 40,10 92,-5" fill="none" stroke="#67e8f9" stroke-width="3" opacity="0.6"/>
    <path d="M-18,110 L-22,160 M18,110 L22,160" stroke="#9aa7b5" stroke-width="3"/>
    <rect x="-28" y="160" width="56" height="36" rx="5" fill="#155e63" stroke="#67e8f9" stroke-width="4"/>
  </g>
  <!-- Île -->
  <path d="M260,760 C330,700 400,690 470,640 C540,590 590,520 650,500 C700,485 720,520 760,515 C800,510 830,470 880,480 C960,495 1010,580 1080,630 C1150,680 1250,700 1330,760 Z" fill="url(#isle)"/>
  <path d="M650,500 C680,492 700,505 720,512" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.6"/>
  <path d="M760,500 C770,470 790,440 780,410 C800,440 790,470 800,490" fill="none" stroke="#9aa7b5" stroke-width="3" opacity="0.5"/>
  <!-- Océan -->
  <rect x="0" y="760" width="1600" height="240" fill="url(#sea)"/>
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.5"/>
  <g fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <path d="M180,820 q30,-12 60,0 t60,0"/><path d="M620,850 q30,-12 60,0 t60,0"/>
    <path d="M1080,815 q30,-12 60,0 t60,0"/><path d="M1340,880 q30,-12 60,0 t60,0"/>
    <path d="M380,910 q30,-12 60,0 t60,0"/>
  </g>
  <text x="1480" y="940" text-anchor="end" class="sub">d'après Jules Verne · générique « L'Île bleue »</text>
</svg>
