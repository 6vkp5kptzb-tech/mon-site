<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Illustration : une forme d'onde et une note de musique, pour un nouveau morceau créé avec Suno">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#072a33"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .big { font: 800 92px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e6edf3; letter-spacing: -1px; }
      .eyebrow { font: 600 28px ui-monospace, "Cascadia Code", Consolas, monospace; fill: #67e8f9; letter-spacing: 3px; }
      .sub { font: 24px ui-monospace, "Cascadia Code", Consolas, monospace; fill: #9aa7b5; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="14" fill="url(#band)"/>
  <text x="120" y="150" class="eyebrow">SUNO · MES COMPOSITIONS</text>
  <text x="120" y="250" class="big">Nouveau morceau</text>
  <!-- Forme d'onde : barres symétriques autour de y = 640 -->
  <g fill="url(#wave)">
    <rect x="120" y="610" width="22" height="60" rx="11"/>
    <rect x="160" y="570" width="22" height="140" rx="11"/>
    <rect x="200" y="520" width="22" height="240" rx="11"/>
    <rect x="240" y="580" width="22" height="120" rx="11"/>
    <rect x="280" y="480" width="22" height="320" rx="11"/>
    <rect x="320" y="440" width="22" height="400" rx="11"/>
    <rect x="360" y="530" width="22" height="220" rx="11"/>
    <rect x="400" y="590" width="22" height="100" rx="11"/>
    <rect x="440" y="500" width="22" height="280" rx="11"/>
    <rect x="480" y="420" width="22" height="440" rx="11"/>
    <rect x="520" y="470" width="22" height="340" rx="11"/>
    <rect x="560" y="560" width="22" height="160" rx="11"/>
    <rect x="600" y="600" width="22" height="80" rx="11"/>
    <rect x="640" y="540" width="22" height="200" rx="11"/>
    <rect x="680" y="460" width="22" height="360" rx="11"/>
    <rect x="720" y="510" width="22" height="260" rx="11"/>
    <rect x="760" y="580" width="22" height="120" rx="11"/>
    <rect x="800" y="530" width="22" height="220" rx="11"/>
    <rect x="840" y="490" width="22" height="300" rx="11"/>
    <rect x="880" y="560" width="22" height="160" rx="11"/>
    <rect x="920" y="600" width="22" height="80" rx="11"/>
    <rect x="960" y="575" width="22" height="130" rx="11"/>
    <rect x="1000" y="615" width="22" height="50" rx="11"/>
  </g>
  <g transform="translate(1150 400) scale(15)" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </g>
  <text x="1480" y="920" text-anchor="end" class="sub">à écouter directement sur le site</text>
</svg>
