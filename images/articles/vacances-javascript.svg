<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Un éditeur de code JavaScript à côté d'un grand compte à rebours avant les vacances">
  <defs>
    <radialGradient id="bg" cx="65%" cy="40%" r="85%">
      <stop offset="0" stop-color="#132131"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2736"/>
      <stop offset="1" stop-color="#121b26"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Soleil -->
  <circle cx="1400" cy="170" r="150" fill="url(#sun)"/>
  <circle cx="1400" cy="170" r="48" fill="#fbbf24"/>

  <!-- Titre -->
  <text x="80" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#e6edf3">J − combien ?</text>
  <text x="80" y="160" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26" fill="#9aa7b5">Un compte à rebours avant les vacances, en quelques lignes de JavaScript</text>

  <!-- Éditeur de code -->
  <g transform="translate(80 230)">
    <rect width="660" height="680" rx="16" fill="url(#card)" stroke="#243041" stroke-width="2"/>
    <path d="M0 16a16 16 0 0 1 16-16h628a16 16 0 0 1 16 16v28H0z" fill="#22d3ee" fill-opacity="0.1"/>
    <circle cx="26" cy="22" r="7" fill="#f87171"/>
    <circle cx="50" cy="22" r="7" fill="#fbbf24"/>
    <circle cx="74" cy="22" r="7" fill="#34d399"/>
    <text x="110" y="29" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#9aa7b5">vacances.js</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="21">
      <g fill="#4b5a6b" text-anchor="end">
        <text x="48" y="96">1</text><text x="48" y="132">2</text><text x="48" y="168">3</text>
        <text x="48" y="204">4</text><text x="48" y="240">5</text><text x="48" y="276">6</text>
        <text x="48" y="312">7</text><text x="48" y="348">8</text><text x="48" y="384">9</text>
        <text x="48" y="420">10</text><text x="48" y="456">11</text><text x="48" y="492">12</text>
        <text x="48" y="528">13</text><text x="48" y="564">14</text><text x="48" y="600">15</text>
        <text x="48" y="636">16</text>
      </g>
      <text x="70" y="96" fill="#6b7a8b">// Date des prochaines vacances</text>
      <text x="70" y="132"><tspan fill="#c084fc">const</tspan><tspan fill="#e6edf3"> debut = </tspan><tspan fill="#c084fc">new</tspan><tspan fill="#67e8f9"> Date</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#34d399">"2026-11-07"</tspan><tspan fill="#e6edf3">);</tspan></text>
      <text x="70" y="204"><tspan fill="#c084fc">function</tspan><tspan fill="#67e8f9"> mettreAJour</tspan><tspan fill="#e6edf3">() {</tspan></text>
      <text x="100" y="240"><tspan fill="#c084fc">const</tspan><tspan fill="#e6edf3"> reste = debut - </tspan><tspan fill="#67e8f9">Date</tspan><tspan fill="#e6edf3">.now();</tspan></text>
      <text x="100" y="276"><tspan fill="#c084fc">if</tspan><tspan fill="#e6edf3"> (reste &lt;= </tspan><tspan fill="#fbbf24">0</tspan><tspan fill="#e6edf3">) </tspan><tspan fill="#c084fc">return</tspan><tspan fill="#e6edf3">;</tspan></text>
      <text x="100" y="348"><tspan fill="#c084fc">const</tspan><tspan fill="#e6edf3"> jours = </tspan><tspan fill="#67e8f9">Math</tspan><tspan fill="#e6edf3">.floor(reste / </tspan><tspan fill="#fbbf24">86400000</tspan><tspan fill="#e6edf3">);</tspan></text>
      <text x="100" y="384"><tspan fill="#c084fc">const</tspan><tspan fill="#e6edf3"> heures = </tspan><tspan fill="#6b7a8b">…</tspan></text>
      <text x="100" y="420"><tspan fill="#c084fc">const</tspan><tspan fill="#e6edf3"> minutes = </tspan><tspan fill="#6b7a8b">…</tspan></text>
      <text x="100" y="456"><tspan fill="#c084fc">const</tspan><tspan fill="#e6edf3"> secondes = </tspan><tspan fill="#6b7a8b">…</tspan></text>
      <text x="100" y="528"><tspan fill="#e6edf3">compteur.textContent = </tspan><tspan fill="#6b7a8b">…</tspan><tspan fill="#e6edf3">;</tspan></text>
      <text x="100" y="564"><tspan fill="#67e8f9">setTimeout</tspan><tspan fill="#e6edf3">(mettreAJour, </tspan><tspan fill="#fbbf24">1000</tspan><tspan fill="#e6edf3">);</tspan></text>
      <text x="70" y="600" fill="#e6edf3">}</text>
      <text x="70" y="636"><tspan fill="#67e8f9">mettreAJour</tspan><tspan fill="#e6edf3">();</tspan></text>
    </g>
  </g>

  <!-- Flèche code → affichage -->
  <path d="M770 570H850" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="6 8"/>
  <path d="M846 560L862 570L846 580" fill="none" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Compte à rebours -->
  <g transform="translate(890 380)" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
    <text x="315" y="0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="28" fill="#9aa7b5">Les prochaines vacances sont dans</text>
    <g transform="translate(0 40)">
      <rect width="140" height="160" rx="14" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
      <text x="70" y="100" font-size="72" font-weight="700" fill="#67e8f9">32</text>
      <text x="70" y="140" font-size="22" fill="#9aa7b5">jours</text>
    </g>
    <g transform="translate(163 40)">
      <rect width="140" height="160" rx="14" fill="url(#card)" stroke="#243041" stroke-width="2"/>
      <text x="70" y="100" font-size="72" font-weight="700" fill="#e6edf3">05</text>
      <text x="70" y="140" font-size="22" fill="#9aa7b5">h</text>
    </g>
    <g transform="translate(326 40)">
      <rect width="140" height="160" rx="14" fill="url(#card)" stroke="#243041" stroke-width="2"/>
      <text x="70" y="100" font-size="72" font-weight="700" fill="#e6edf3">12</text>
      <text x="70" y="140" font-size="22" fill="#9aa7b5">min</text>
    </g>
    <g transform="translate(489 40)">
      <rect width="140" height="160" rx="14" fill="url(#card)" stroke="#243041" stroke-width="2"/>
      <text x="70" y="100" font-size="72" font-weight="700" fill="#e6edf3">48</text>
      <text x="70" y="140" font-size="22" fill="#9aa7b5">s</text>
    </g>
    <!-- horizon : collines -->
    <path d="M0 420C120 340 220 340 330 400S540 330 630 380V460H0z" fill="#22d3ee" fill-opacity="0.08"/>
    <path d="M0 420C120 340 220 340 330 400S540 330 630 380" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
